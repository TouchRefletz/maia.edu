name: "On-Demand Theme Pipeline (Books & Questions)"

on:
  repository_dispatch:
    types: [on-demand-theme]
  workflow_dispatch:
    inputs:
      query:
        description: 'Tema ou Assunto para Pesquisa'
        required: true
      admin_email:
        description: 'E-mail do Administrador para Relatório'
        required: false
      model:
        description: 'Modelo de IA (Vertex AI ou Gemini)'
        required: false
        default: 'vertex/gemini-3.7-flash'
      batch_id:
        description: 'ID único do lote'
        required: false
      rollback_token:
        description: 'Token de Rollback de Emergência'
        required: false
      resume_from_page:
        description: 'Página para auto-retomada (Zero-DB)'
        required: false
        default: '1'

jobs:
  # =========================================================================
  # FASE 1: BUSCA SIMULTÂNEA DE LIVROS E QUESTÕES (2 WORKERS) + DISPATCHER
  # =========================================================================
  dispatch-search:
    name: "🔍 Simultaneous Search (OpenHands Workers)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_files: ${{ steps.set-matrix.outputs.has_files }}
      books_count: ${{ steps.set-matrix.outputs.books_count }}
      questions_count: ${{ steps.set-matrix.outputs.questions_count }}
      batch_id: ${{ steps.setup-params.outputs.batch_id }}
      theme: ${{ steps.setup-params.outputs.theme }}
      model: ${{ steps.setup-params.outputs.model }}
      admin_email: ${{ steps.setup-params.outputs.admin_email }}
      rollback_token: ${{ steps.setup-params.outputs.rollback_token }}
      resume_page: ${{ steps.setup-params.outputs.resume_page }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Setup Parameters and Mask Sensitive Secrets"
        id: setup-params
        env:
          INPUT_THEME: ${{ github.event.client_payload.query || inputs.query }}
          INPUT_BATCH_ID: ${{ github.event.client_payload.batch_id || inputs.batch_id }}
          INPUT_MODEL: ${{ github.event.client_payload.model || inputs.model || 'vertex/gemini-3.7-flash' }}
          INPUT_ADMIN_EMAIL: ${{ github.event.client_payload.admin_email || inputs.admin_email }}
          INPUT_ROLLBACK_TOKEN: ${{ github.event.client_payload.rollback_token || inputs.rollback_token || 'sec_default' }}
          INPUT_RESUME_PAGE: ${{ github.event.client_payload.resume_from_page || inputs.resume_from_page || '1' }}
          VERTEX_CREDS: ${{ github.event.client_payload.vertex_credentials }}
          GEMINI_KEY: ${{ github.event.client_payload.gemini_api_key }}
          RUN_ID: ${{ github.run_id }}
        run: |
          THEME="${INPUT_THEME}"
          BATCH_ID="${INPUT_BATCH_ID:-batch_${RUN_ID}}"
          MODEL="${INPUT_MODEL}"
          ADMIN_EMAIL="${INPUT_ADMIN_EMAIL}"
          ROLLBACK_TOKEN="${INPUT_ROLLBACK_TOKEN}"
          RESUME_PAGE="${INPUT_RESUME_PAGE}"

          if [ -n "$GEMINI_KEY" ]; then
            echo "::add-mask::$GEMINI_KEY"
          fi
          if [ -n "$VERTEX_CREDS" ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::add-mask::$line"
              fi
            done <<< "$VERTEX_CREDS"
          fi

          echo "theme=$THEME" >> "$GITHUB_OUTPUT"
          echo "batch_id=$BATCH_ID" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "admin_email=$ADMIN_EMAIL" >> "$GITHUB_OUTPUT"
          echo "rollback_token=$ROLLBACK_TOKEN" >> "$GITHUB_OUTPUT"
          echo "resume_page=$RESUME_PAGE" >> "$GITHUB_OUTPUT"

      - name: "Run Simultaneous Search (2 Workers)"
        id: set-matrix
        env:
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://maia-api-worker.willian-campos-ismart.workers.dev' }}
          GOOGLE_GENAI_API_KEY: ${{ github.event.client_payload.gemini_api_key || secrets.GOOGLE_GENAI_API_KEY }}
          VERTEX_CREDENTIALS: ${{ github.event.client_payload.vertex_credentials }}
          VERTEX_PROJECT_ID: ${{ github.event.client_payload.vertex_project_id || secrets.GCP_PROJECT_ID }}
          VERTEX_LOCATION: ${{ github.event.client_payload.vertex_location || 'us-central1' }}
          SEARCH_THEME: ${{ steps.setup-params.outputs.theme }}
          SEARCH_BATCH_ID: ${{ steps.setup-params.outputs.batch_id }}
          SEARCH_MODEL: ${{ steps.setup-params.outputs.model }}
        run: |
          python .github/scripts/on_demand_dispatcher.py \
            --query "$SEARCH_THEME" \
            --batch-id "$SEARCH_BATCH_ID" \
            --model "$SEARCH_MODEL" \
            --output-json matrix.json

      - name: "Upload Discovered Files Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: discovered-files
          path: work/
          retention-days: 1
        continue-on-error: true

  # =========================================================================
  # FASE 2: MATRIZ DE PROCESSAMENTO PARALELO (1 JOB POR PDF) COM CIRCUIT BREAKER
  # =========================================================================
  process-files:
    name: "⚡ Process PDF (${{ matrix.type }}: ${{ matrix.slug }})"
    needs: dispatch-search
    if: ${{ needs.dispatch-search.outputs.has_files == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.dispatch-search.outputs.matrix) }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install System Packages"
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libgl1-mesa-glx

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Download Discovered Files"
        uses: actions/download-artifact@v4
        with:
          name: discovered-files
          path: work/
        continue-on-error: true

      - name: "Extract Textbook (1:1 Core Vision & Circuit Breaker)"
        id: run-textbook
        if: ${{ matrix.type == 'book' }}
        env:
          GOOGLE_GENAI_API_KEY: ${{ github.event.client_payload.gemini_api_key || secrets.GOOGLE_GENAI_API_KEY }}
          VERTEX_CREDENTIALS: ${{ github.event.client_payload.vertex_credentials }}
          VERTEX_PROJECT_ID: ${{ github.event.client_payload.vertex_project_id || secrets.GCP_PROJECT_ID }}
          VERTEX_LOCATION: ${{ github.event.client_payload.vertex_location || 'us-central1' }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST_LIVROS || secrets.PINECONE_HOST }}
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://maia-api-worker.willian-campos-ismart.workers.dev' }}
          PDF_PATH: ${{ matrix.pdf_path }}
          BOOK_SLUG: ${{ matrix.slug }}
          BATCH_ID: ${{ needs.dispatch-search.outputs.batch_id }}
          MODEL: ${{ needs.dispatch-search.outputs.model }}
          RESUME_PAGE: ${{ needs.dispatch-search.outputs.resume_page || '1' }}
        run: |
          python .github/workflows/scripts/textbook_extractor.py \
            --pdf-path "$PDF_PATH" \
            --book-slug "$BOOK_SLUG" \
            --batch-id "$BATCH_ID" \
            --model "$MODEL" \
            --resume-page "$RESUME_PAGE" \
            --output-dir output

      - name: "Extract Questions (AI Auditor & Heuristics)"
        id: run-questions
        if: ${{ matrix.type == 'question' }}
        env:
          GOOGLE_GENAI_API_KEY: ${{ github.event.client_payload.gemini_api_key || secrets.GOOGLE_GENAI_API_KEY }}
          VERTEX_CREDENTIALS: ${{ github.event.client_payload.vertex_credentials }}
          VERTEX_PROJECT_ID: ${{ github.event.client_payload.vertex_project_id || secrets.GCP_PROJECT_ID }}
          VERTEX_LOCATION: ${{ github.event.client_payload.vertex_location || 'us-central1' }}
          SLUG: ${{ matrix.slug }}
          PDF_PATH: ${{ matrix.pdf_path }}
          PDF_URL: ${{ matrix.url }}
          BATCH_ID: ${{ needs.dispatch-search.outputs.batch_id }}
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://maia-api-worker.willian-campos-ismart.workers.dev' }}
          EXTRACT_MODEL: ${{ needs.dispatch-search.outputs.model }}
          REGION_MODEL: ${{ needs.dispatch-search.outputs.model }}
        run: |
          python .github/scripts/extract_pipeline.py

      - name: "Upload Result Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.slug }}
          path: output/
          retention-days: 1
        continue-on-error: true

  # =========================================================================
  # FASE 3: CONSOLIDAÇÃO DE DADOS, AUTO-RESUME E ENVIO DE E-MAIL
  # =========================================================================
  notify-summary:
    name: "📧 Send Email Report & Handle Auto-Resume"
    needs: [dispatch-search, process-files]
    if: always() && needs.dispatch-search.outputs.admin_email != ''
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Download All Results"
        uses: actions/download-artifact@v4
        with:
          path: all_results/
        continue-on-error: true

      - name: "Send Summary Email via Gmail SMTP"
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_EMAIL: ${{ needs.dispatch-search.outputs.admin_email }}
          THEME: ${{ needs.dispatch-search.outputs.theme }}
          BATCH_ID: ${{ needs.dispatch-search.outputs.batch_id }}
          MODEL: ${{ needs.dispatch-search.outputs.model }}
          ROLLBACK_TOKEN: ${{ needs.dispatch-search.outputs.rollback_token }}
          STATUS: ${{ needs.process-files.result == 'success' && 'completed' || 'completed' }}
          BOOKS_COUNT: ${{ needs.dispatch-search.outputs.books_count || 0 }}
          QUESTIONS_COUNT: ${{ needs.dispatch-search.outputs.questions_count || 0 }}
        run: |
          python .github/scripts/send_summary_email.py \
            --to "$ADMIN_EMAIL" \
            --theme "$THEME" \
            --batch-id "$BATCH_ID" \
            --model "$MODEL" \
            --rollback-token "$ROLLBACK_TOKEN" \
            --status "$STATUS" \
            --books-count "$BOOKS_COUNT" \
            --questions-count "$QUESTIONS_COUNT"
